# Déploiement du site sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      # musique/ : planche d'écoute du lot 1b (noindex, non reliée au site) et fichiers de musique.
      - name: Préparer le site (fichiers statiques, sans build)
        run: |
          mkdir -p _site
          cp -r index.html main.html favicon.ico site.webmanifest robots.txt sitemap.xml admin css js fonts img musique sons scene scene-v2 contenus .nojekyll _site/
          # favicon.ico, site.webmanifest : icônes et manifeste (lot 4a, outils/icones/fabriquer.mjs), à la racine du site.
          # robots.txt, sitemap.xml : référencement (lot 4a, Docs/ref/referencement.md), une seule page indexable.
          # img/accueil/ : vidéos et affiches de l'accueil (lot 2b) ; sons/ : coup de feu du jeu, copie figée (lot 2b).
          # admin/ : page d'administration des actualités (lot 3b), noindex, non reliée au site (Docs/ref/admin.md).
          # img/actus/ : images des articles, ajoutées par le serveur (commit sur main) ; ce workflow les republie.
          # contenus/ : contenus modifiables sans toucher au code (bandeau d'alerte…), lus par le site (Docs/ref/contenus.md).
          # scene/ : atelier de la scène 3D de l'accueil (lot 1) ; pages en noindex, non reliées au site.
          # Les outils de capture (scene/outils/, Node + Playwright) ne sont pas publiés.
          # scene-v2/ : scène v2 de l'accueil, en coulisses (lot 5a : nouvelles armes du jeu) ; noindex, interdite dans robots.txt, reliée à rien.
          rm -rf _site/scene/outils _site/scene-v2/outils

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
